openapi: 3.0.3
info:
  title: DHIS2 VPD Tracker API — AFP & MR Case Submission
  description: |
    REST API documentation for submitting **Acute Flaccid Paralysis (AFP)** and
    **Measles/Rubella (MR)** surveillance cases into the PAHO DHIS2 VPD tracker.

    ## Overview

    Cases follow the standard DHIS2 Tracker data model:

    ```
    TrackedEntity  (one per patient / case)
        └── Enrollment  (one per program: AFP or MR)
                └── Event  (one per program stage completed)
                        └── DataValues  (the actual surveillance fields)
    ```

    ## API Versions

    | DHIS2 Version | Endpoint style | Notes |
    |---------------|---------------|-------|
    | ≥ 2.38        | `/api/tracker` (new) | Single endpoint, `atomicMode=OBJECT` supported |
    | < 2.38        | `/api/trackedEntityInstances`, `/api/enrollments`, `/api/events` (legacy) | Three separate endpoints |

    ## Authentication

    All endpoints require **HTTP Basic Authentication**.  Use a dedicated
    service account — never embed personal credentials in scripts.

    ## Programs & UIDs

    | Program | Short name | UID |
    |---------|-----------|-----|
    | Acute Flaccid Paralysis | AFP | `ahWrhrzEAD1` |
    | Measles / Rubella | MR | `Hh5bklmdAw7` |
    | Tracked Entity Type (Case) | — | `Hb3HvqaWl2u` |

    ## AFP Program Stages

    | Stage | Name | UID |
    |-------|------|-----|
    | 1 | Vaccination History | `C9dBVr0UBuJ` |
    | 2 | Laboratory | `LpNBXGQkooA` |
    | 4 | Follow-up (60-day) | `E6ZeAvTRmqN` |
    | 5 | Control Measures | `S3ww7v7EVeF` |
    | 6 | Final Classification | `FxIwQV5FR13` |

    ## MR Program Stages

    | Stage | Name | UID |
    |-------|------|-----|
    | 1 | Vaccination History | `N95IXBS7OQk` |
    | 2 | Laboratory | `sNQqHHN5gi3` |
    | 3 | Investigation | `cjq7fSjgq5N` |
    | 4 | Response Measures | `UNpKMRHGK0R` |
    | 5 | Final Classification | `okXkga3RhRG` |

    ## Key Tracked Entity Attributes (shared AFP & MR)

    | Attribute UID | Name | Type |
    |---------------|------|------|
    | `qGSb6sFg1lD` | Case ID | TEXT |
    | `CWAxFAbxYUd` | Full Name | TEXT |
    | `ACeWiOj15cU` | Date of Birth | DATE |
    | `zk2BaGzXyC4` | Age (years) | INTEGER |
    | `KVmhApZNh5I` | Address | TEXT |
    | `cpu4Y9A1KZp` | Notification Date | DATE |
    | `wk6qdaPtAAT` | Onset Date | DATE |
    | `fogdujfI9yt` | Reporting Hospital | TEXT |
    | `MPZ1QsldiKH` | EPI Year | INTEGER |
    | `BJOIp2AWzaD` | EPI Week | INTEGER |
    | `vjj5cyugYyx` | Internal Reference (slug) | TEXT |

  version: "1.0.0"
  contact:
    name: PAHO – CIM Information Systems
    email: vpd-dhis2@paho.org

servers:
  - url: https://vpd.paho-dhis2.org
    description: Production — VPD SMART (DHIS2 2.36)
  - url: https://vpd-42.paho-dhis2.org
    description: Migration target — DHIS2 2.42
  - url: https://vpd-test.paho-dhis2.org
    description: Test / QA environment
  - url: https://vpd-dev.paho-dhis2.org
    description: Development / sandbox environment

security:
  - basicAuth: []

tags:
  - name: New Tracker API (≥ 2.38)
    description: |
      Use `/api/tracker` for DHIS2 versions **2.38 and above**.
      Supports `atomicMode=OBJECT` so a single failing entity does not
      roll back the whole batch.
  - name: Legacy Tracker API (< 2.38)
    description: |
      Use these three endpoints for DHIS2 versions **below 2.38**.
      Call them sequentially: TEIs → Enrollments → Events.
  - name: Query
    description: Read / query existing tracker data.
  - name: Metadata
    description: Look up program metadata, org units, and system info.

paths:

  # ─────────────────────────────────────────────────────────────────────────
  # NEW TRACKER API  (≥ 2.38)
  # ─────────────────────────────────────────────────────────────────────────

  /api/tracker:
    post:
      tags:
        - New Tracker API (≥ 2.38)
      summary: Submit AFP or MR cases (new tracker API)
      description: |
        Submits TrackedEntities, Enrollments, and/or Events in a single
        request.  For bulk migration send one entity type per request:
        - Pass only `trackedEntities` in the first call.
        - Pass only `enrollments` in the second call.
        - Pass only `events` in the third call.

        **Recommended import params** (pass as query parameters):

        | Parameter | Value | Description |
        |-----------|-------|-------------|
        | `importStrategy` | `CREATE_AND_UPDATE` | Insert new + update existing |
        | `atomicMode` | `OBJECT` | Failing objects don't roll back the batch |
        | `skipProgramRules` | `true` | Avoid E1085/E1309 on calculated fields |
        | `importReportMode` | `ERRORS` | Only return error details |
        | `async` | `false` | Synchronous response |

      parameters:
        - $ref: '#/components/parameters/importStrategy'
        - $ref: '#/components/parameters/atomicMode'
        - $ref: '#/components/parameters/skipProgramRules'
        - $ref: '#/components/parameters/importReportMode'
        - $ref: '#/components/parameters/async'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackerPayload'
            examples:
              afp_case_full:
                summary: AFP case – full payload (TEI + enrollment + stages)
                $ref: '#/components/examples/AFPCaseFull'
              mr_case_full:
                summary: MR case – full payload (TEI + enrollment + stages)
                $ref: '#/components/examples/MRCaseFull'
              teis_only:
                summary: TEIs only (step 1 of 3 in batch migration)
                $ref: '#/components/examples/TEIsOnly'

      responses:
        '200':
          description: Import completed (check `status` field — may be `ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackerImportReport'
              examples:
                success:
                  summary: Successful import
                  value:
                    status: "OK"
                    stats:
                      created: 1
                      updated: 0
                      deleted: 0
                      ignored: 0
                      total: 1
                    validationReport:
                      errorReports: []
                      warningReports: []
                error_example:
                  summary: Partial error (atomicMode=OBJECT)
                  value:
                    status: "WARNING"
                    stats:
                      created: 0
                      updated: 0
                      deleted: 0
                      ignored: 1
                      total: 1
                    validationReport:
                      errorReports:
                        - errorCode: "E1085"
                          message: "Value does not match attribute type"
                          uid: "abc12345678"
        '400':
          description: Bad request (malformed JSON or missing required fields)
        '401':
          description: Unauthorized – check Basic Auth credentials
        '403':
          description: Forbidden – user lacks import permissions

  # ─────────────────────────────────────────────────────────────────────────
  # NEW TRACKER – READ
  # ─────────────────────────────────────────────────────────────────────────

  /api/tracker/trackedEntities:
    get:
      tags:
        - New Tracker API (≥ 2.38)
        - Query
      summary: Query tracked entities (cases) — new API
      description: |
        Returns tracked entities for a given program and/or org unit.
        Use `ouMode=DESCENDANTS` to include all sub-org units.
      parameters:
        - name: program
          in: query
          required: true
          description: Program UID (`ahWrhrzEAD1` for AFP, `Hh5bklmdAw7` for MR)
          schema:
            type: string
            example: ahWrhrzEAD1
        - name: orgUnit
          in: query
          description: Root org unit UID (e.g. country UID `f67vzuvH3D5` for Paraguay)
          schema:
            type: string
            example: f67vzuvH3D5
        - name: ouMode
          in: query
          description: Org unit mode
          schema:
            type: string
            enum: [SELECTED, CHILDREN, DESCENDANTS, ACCESSIBLE, CAPTURE, ALL]
            default: DESCENDANTS
        - name: enrollmentEnrolledAfter
          in: query
          description: ISO-8601 date — only return enrollments on or after this date
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: fields
          in: query
          description: Fields projection (default returns all fields)
          schema:
            type: string
            example: "*,!enrollments"
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
            maximum: 1000
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paged list of tracked entities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedEntityPage'

  /api/tracker/enrollments:
    get:
      tags:
        - New Tracker API (≥ 2.38)
        - Query
      summary: Query enrollments — new API
      parameters:
        - name: program
          in: query
          required: true
          schema:
            type: string
            example: ahWrhrzEAD1
        - name: orgUnit
          in: query
          schema:
            type: string
        - name: ouMode
          in: query
          schema:
            type: string
            enum: [SELECTED, CHILDREN, DESCENDANTS, ACCESSIBLE, CAPTURE, ALL]
            default: DESCENDANTS
        - name: enrolledAfter
          in: query
          schema:
            type: string
            format: date
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paged list of enrollments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentPage'

  /api/tracker/events:
    get:
      tags:
        - New Tracker API (≥ 2.38)
        - Query
      summary: Query events — new API
      parameters:
        - name: program
          in: query
          required: true
          schema:
            type: string
        - name: programStage
          in: query
          schema:
            type: string
        - name: orgUnit
          in: query
          schema:
            type: string
        - name: ouMode
          in: query
          schema:
            type: string
            default: DESCENDANTS
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paged list of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'

  # ─────────────────────────────────────────────────────────────────────────
  # LEGACY TRACKER API  (< 2.38)
  # ─────────────────────────────────────────────────────────────────────────

  /api/trackedEntityInstances:
    post:
      tags:
        - Legacy Tracker API (< 2.38)
      summary: Create / update tracked entity instances (TEIs)
      description: |
        **Step 1 of 3** for legacy import.  Call before `/api/enrollments`.

        Wrap the array under `{"trackedEntityInstances": [...]}`.

      parameters:
        - $ref: '#/components/parameters/importStrategy'
        - $ref: '#/components/parameters/skipProgramRules'
        - $ref: '#/components/parameters/importReportMode'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackedEntityInstances]
              properties:
                trackedEntityInstances:
                  type: array
                  items:
                    $ref: '#/components/schemas/TrackedEntityLegacy'
            examples:
              afp_tei:
                summary: AFP TEI payload (legacy)
                $ref: '#/components/examples/LegacyTEI'

      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyImportSummary'

    get:
      tags:
        - Legacy Tracker API (< 2.38)
        - Query
      summary: Query tracked entity instances (legacy)
      parameters:
        - name: program
          in: query
          required: true
          schema:
            type: string
        - name: ou
          in: query
          schema:
            type: string
        - name: ouMode
          in: query
          schema:
            type: string
            default: ALL
        - name: programStartDate
          in: query
          schema:
            type: string
            format: date
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: fields
          in: query
          schema:
            type: string
            example: "*,!enrollments"
        - name: includeAllAttributes
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Paged list of TEIs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedEntityInstancePage'

  /api/enrollments:
    post:
      tags:
        - Legacy Tracker API (< 2.38)
      summary: Create / update enrollments
      description: |
        **Step 2 of 3** for legacy import.  Call after `/api/trackedEntityInstances`
        and before `/api/events`.

      parameters:
        - $ref: '#/components/parameters/importStrategy'
        - $ref: '#/components/parameters/skipProgramRules'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollments]
              properties:
                enrollments:
                  type: array
                  items:
                    $ref: '#/components/schemas/EnrollmentLegacy'
            examples:
              afp_enrollment:
                summary: AFP enrollment payload (legacy)
                $ref: '#/components/examples/LegacyEnrollment'

      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyImportSummary'

  /api/events:
    post:
      tags:
        - Legacy Tracker API (< 2.38)
      summary: Create / update events
      description: |
        **Step 3 of 3** for legacy import.  Call after `/api/enrollments`.

      parameters:
        - $ref: '#/components/parameters/importStrategy'
        - $ref: '#/components/parameters/skipProgramRules'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/Event'
            examples:
              afp_events:
                summary: AFP event batch (legacy)
                $ref: '#/components/examples/LegacyEvents'

      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyImportSummary'

  # ─────────────────────────────────────────────────────────────────────────
  # METADATA
  # ─────────────────────────────────────────────────────────────────────────

  /api/system/info:
    get:
      tags:
        - Metadata
      summary: Get system information (including DHIS2 version)
      description: |
        Use this endpoint first to detect the DHIS2 version and choose
        the correct API path (new vs. legacy tracker).
      responses:
        '200':
          description: System info object
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "2.42.0"
                  revision:
                    type: string
                  buildTime:
                    type: string
                    format: date-time

  /api/organisationUnits:
    get:
      tags:
        - Metadata
      summary: Resolve org unit UID from ISO-3 country code
      description: |
        Look up the DHIS2 UID for a country using its ISO 3166-1 alpha-3 code.
      parameters:
        - name: filter
          in: query
          description: Filter expression (e.g. `code:eq:PRY`)
          schema:
            type: string
            example: "code:eq:PRY"
        - name: fields
          in: query
          schema:
            type: string
            default: "id,name,code,level"
      responses:
        '200':
          description: Matching org units
          content:
            application/json:
              schema:
                type: object
                properties:
                  organisationUnits:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "f67vzuvH3D5"
                        name:
                          type: string
                          example: "Paraguay"
                        code:
                          type: string
                          example: "PRY"
                        level:
                          type: integer
                          example: 2

  /api/programs/{programUid}:
    get:
      tags:
        - Metadata
      summary: Get program metadata (stages, data elements, options)
      parameters:
        - name: programUid
          in: path
          required: true
          schema:
            type: string
          examples:
            afp:
              value: ahWrhrzEAD1
              summary: AFP program
            mr:
              value: Hh5bklmdAw7
              summary: MR program
        - name: fields
          in: query
          schema:
            type: string
            default: "id,name,programType,programStages[id,name,programStageDataElements[dataElement[id,name,valueType,optionSet[options[code,name]]]]]"
      responses:
        '200':
          description: Program metadata

# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Provide a DHIS2 service-account username and password.
        Credentials should be stored in a `.key` INI file — never hard-coded.

  # ── Reusable query parameters ──────────────────────────────────────────────

  parameters:
    importStrategy:
      name: importStrategy
      in: query
      description: Import mode
      schema:
        type: string
        enum: [CREATE, UPDATE, CREATE_AND_UPDATE, DELETE]
        default: CREATE_AND_UPDATE

    atomicMode:
      name: atomicMode
      in: query
      description: |
        `ALL` – if any object fails the entire batch is rolled back.
        `OBJECT` – only the failing object is rejected (recommended for bulk import).
      schema:
        type: string
        enum: [ALL, OBJECT]
        default: OBJECT

    skipProgramRules:
      name: skipProgramRules
      in: query
      description: |
        Skip program-rule execution during import.
        **Recommended `true`** for migration payloads to avoid `E1085`/`E1309`
        errors from calculated attributes.
      schema:
        type: boolean
        default: true

    importReportMode:
      name: importReportMode
      in: query
      description: Verbosity of the import report
      schema:
        type: string
        enum: [FULL, ERRORS, DEBUG]
        default: ERRORS

    async:
      name: async
      in: query
      description: |
        `false` – wait for the import to finish and return the report inline.
        `true` – return a job ID immediately; poll `/api/system/tasks` for status.
      schema:
        type: boolean
        default: false

  # ── Core schemas ──────────────────────────────────────────────────────────

  schemas:

    Attribute:
      type: object
      required: [attribute, value]
      properties:
        attribute:
          type: string
          description: Tracked Entity Attribute UID (11 chars)
          example: qGSb6sFg1lD
        value:
          description: |
            Attribute value.  Type depends on the attribute's `valueType`:
            TEXT, DATE (YYYY-MM-DD), INTEGER, BOOLEAN, etc.
          example: "PY-001-2024"

    DataValue:
      type: object
      required: [dataElement, value]
      properties:
        dataElement:
          type: string
          description: Data Element UID (11 chars)
          example: GZPDnkInYXV
        value:
          description: Data element value (string even for numerics/dates)
          example: "PLUS_5"

    Event:
      type: object
      required: [program, programStage, orgUnit, occurredAt, status]
      properties:
        event:
          type: string
          description: Event UID — omit to generate a new one; provide to update existing
          example: abc12345678
        program:
          type: string
          description: Program UID
          example: ahWrhrzEAD1
        programStage:
          type: string
          description: Program Stage UID
          example: C9dBVr0UBuJ
        enrollment:
          type: string
          description: Parent enrollment UID (required for linked events)
          example: oZe4QrUfE8g
        trackedEntity:
          type: string
          description: Parent TEI UID (new API field name, ≥ 2.38)
          example: tei12345678
        trackedEntityInstance:
          type: string
          description: Parent TEI UID (legacy API field name, < 2.38)
          example: tei12345678
        orgUnit:
          type: string
          description: Org unit UID where the event occurred
          example: f67vzuvH3D5
        occurredAt:
          type: string
          format: date
          description: Date the stage was completed (ISO-8601)
          example: "2024-02-15"
        scheduledAt:
          type: string
          format: date
          description: Scheduled date (optional)
        status:
          type: string
          enum: [ACTIVE, COMPLETED, VISITED, SCHEDULE, OVERDUE, SKIPPED]
          default: COMPLETED
        dataValues:
          type: array
          items:
            $ref: '#/components/schemas/DataValue'

    Enrollment:
      type: object
      required: [program, orgUnit, enrolledAt]
      properties:
        enrollment:
          type: string
          description: Enrollment UID — omit to generate; provide to update
          example: oZe4QrUfE8g
        program:
          type: string
          description: Program UID
          example: ahWrhrzEAD1
        trackedEntity:
          type: string
          description: Parent TEI UID (≥ 2.38)
          example: tei12345678
        trackedEntityInstance:
          type: string
          description: Parent TEI UID (< 2.38)
          example: tei12345678
        orgUnit:
          type: string
          description: Org unit UID
          example: f67vzuvH3D5
        enrolledAt:
          type: string
          format: date
          description: Date of enrollment / notification (ISO-8601)
          example: "2024-02-15"
        occurredAt:
          type: string
          format: date
          description: Incident date (date of onset / symptom start)
          example: "2024-02-10"
        status:
          type: string
          enum: [ACTIVE, COMPLETED, CANCELLED]
          default: ACTIVE
        attributes:
          type: array
          description: TEA values scoped to this enrollment
          items:
            $ref: '#/components/schemas/Attribute'
        events:
          type: array
          description: Inline events (only used when posting the full tree in one request)
          items:
            $ref: '#/components/schemas/Event'

    TrackedEntity:
      type: object
      required: [trackedEntityType, orgUnit]
      properties:
        trackedEntity:
          type: string
          description: TEI UID — omit to auto-generate; provide to update existing
          example: tei12345678
        trackedEntityType:
          type: string
          description: Tracked Entity Type UID (always `Hb3HvqaWl2u` for VPD cases)
          example: Hb3HvqaWl2u
        orgUnit:
          type: string
          description: Org unit UID (country / facility level)
          example: f67vzuvH3D5
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        enrollments:
          type: array
          description: Inline enrollments (only when posting the full tree in one request)
          items:
            $ref: '#/components/schemas/Enrollment'

    TrackedEntityLegacy:
      allOf:
        - $ref: '#/components/schemas/TrackedEntity'
      properties:
        trackedEntityInstance:
          type: string
          description: TEI UID (legacy field name, < 2.38)
          example: tei12345678
        trackedEntityType:
          type: string
          example: Hb3HvqaWl2u

    EnrollmentLegacy:
      allOf:
        - $ref: '#/components/schemas/Enrollment'
      description: |
        Same schema as `Enrollment` but use `trackedEntityInstance` instead of
        `trackedEntity` for DHIS2 < 2.38.

    TrackerPayload:
      type: object
      description: |
        Payload for the unified `/api/tracker` endpoint (DHIS2 ≥ 2.38).
        Include only the entity types you want to import in each request.
      properties:
        trackedEntities:
          type: array
          items:
            $ref: '#/components/schemas/TrackedEntity'
        enrollments:
          type: array
          items:
            $ref: '#/components/schemas/Enrollment'
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'

    TrackerImportReport:
      type: object
      properties:
        status:
          type: string
          enum: [OK, WARNING, ERROR]
        stats:
          type: object
          properties:
            created:
              type: integer
            updated:
              type: integer
            deleted:
              type: integer
            ignored:
              type: integer
            total:
              type: integer
        validationReport:
          type: object
          properties:
            errorReports:
              type: array
              items:
                type: object
                properties:
                  errorCode:
                    type: string
                    description: |
                      Common error codes:
                      - `E1085` – attribute value type mismatch
                      - `E1309` – program rule validation failure
                      - `E4014` – duplicate unique attribute value
                  message:
                    type: string
                  uid:
                    type: string
                    description: UID of the failing object
            warningReports:
              type: array
              items:
                type: object

    LegacyImportSummary:
      type: object
      properties:
        status:
          type: string
          enum: [SUCCESS, WARNING, ERROR]
        importCount:
          type: object
          properties:
            imported:
              type: integer
            updated:
              type: integer
            ignored:
              type: integer
            deleted:
              type: integer
        importSummaries:
          type: array
          description: Per-object summaries (only present on WARNING/ERROR)
          items:
            type: object
            properties:
              status:
                type: string
              description:
                type: string
              reference:
                type: string

    # ── Pagination wrappers ─────────────────────────────────────────────────

    Pager:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        pageCount:
          type: integer
        nextPage:
          type: string
          description: URL of the next page (new tracker API only)

    TrackedEntityPage:
      type: object
      properties:
        pager:
          $ref: '#/components/schemas/Pager'
        instances:
          type: array
          items:
            $ref: '#/components/schemas/TrackedEntity'

    TrackedEntityInstancePage:
      type: object
      properties:
        pager:
          $ref: '#/components/schemas/Pager'
        trackedEntityInstances:
          type: array
          items:
            $ref: '#/components/schemas/TrackedEntityLegacy'

    EnrollmentPage:
      type: object
      properties:
        pager:
          $ref: '#/components/schemas/Pager'
        instances:
          type: array
          items:
            $ref: '#/components/schemas/Enrollment'

    EventPage:
      type: object
      properties:
        pager:
          $ref: '#/components/schemas/Pager'
        instances:
          type: array
          items:
            $ref: '#/components/schemas/Event'

